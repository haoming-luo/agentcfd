name: Publish release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --no-index dist/*.whl
          wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" doctor --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" capabilities --json
          "$GITHUB_WORKSPACE/wheel-test/bin/python" -c "from agentcfd import contracts; assert contracts.path('parameter-set.schema.json').is_file(); assert contracts.path('inlet-direction-assessment.schema.json').is_file()"
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" calculate compressibility --velocity 100 --speed-of-sound 400 --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" demo pipe --output pipe-result.json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" init operating-point-project --template industrial-pipe
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" params operating-point-project --param mean_velocity=0.015 --output operating-point.json --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" plan operating-point-project --param-file operating-point.json --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" init imported-pressure --template imported-internal-flow --geometry "$GITHUB_WORKSPACE/examples/imported_duct_mesh/geometry/fluid.stl" --unit m --roles "$GITHUB_WORKSPACE/examples/imported_duct_mesh/geometry/boundary-roles.json" --interior-point-m 0.5 0.25 0.1 --inlet-total-gauge-pressure-pa 0.001 --base-size-m 0.05 --maximum-cells 200000
          "$GITHUB_WORKSPACE/wheel-test/bin/python" -c "from agentcfd import projects; p=projects.Project('imported-pressure'); assert p.load_step().model.boundary_conditions['inlet'].total_gauge_pressure == 0.001; assert len(p.parameter_contract()) == 12"
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" init imported-velocity --template imported-internal-flow --geometry "$GITHUB_WORKSPACE/examples/imported_duct_mesh/geometry/fluid.stl" --unit m --roles "$GITHUB_WORKSPACE/examples/imported_duct_mesh/geometry/boundary-roles.json" --interior-point-m 0.5 0.25 0.1 --inlet-velocity-m-s 0.5 0 0 --base-size-m 0.05 --maximum-cells 200000
          "$GITHUB_WORKSPACE/wheel-test/bin/python" -c "from agentcfd import projects; assert projects.Project('imported-velocity').load_step().model.metadata['inlet_velocity_direction']['status'] == 'passed'"
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" prepare openfoam-pipe openfoam-pipe --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" prepare openfoam-turbulent-pipe openfoam-turbulent-pipe --cross-section-cells 4 --axial-cells 20 --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" prepare openfoam-turbulent-wall-study openfoam-turbulent-wall-study --cross-section-cells 4 8 16 --maximum-iterations 20 20 20 --json
          "$GITHUB_WORKSPACE/wheel-test/bin/agentcfd" prepare openfoam-turbulent-wall-function-study openfoam-turbulent-wall-functions --cross-section-cells 4 --maximum-iterations 20 --json
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentcfd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
