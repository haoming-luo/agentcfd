name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: agentcfd doctor

  offline-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --no-index dist/*.whl
      - run: wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: wheel-test/bin/agentcfd doctor --json
      - run: wheel-test/bin/agentcfd contracts --json
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-precursor-map.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-wall-study.schema.json').is_file(); assert contracts.path('turbulent-wall-study.schema.json').is_file(); assert contracts.path('turbulent-precursor-grid-study.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-wall-function-study.schema.json').is_file(); assert contracts.path('turbulent-wall-function-study.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-model-study.schema.json').is_file(); assert contracts.path('turbulent-model-study.schema.json').is_file(); assert contracts.path('turbulent-model-sweep.schema.json').is_file()"
      - run: wheel-test/bin/agentcfd calculate compressibility --velocity 100 --speed-of-sound 400 --json
      - run: wheel-test/bin/agentcfd calculate wall-resolution --density 998.2 --viscosity 0.001002 --velocity 0.5 --diameter 0.1 --target-y-plus 40 --json
      - run: wheel-test/bin/agentcfd demo pipe --output pipe-result.json
      - run: wheel-test/bin/agentcfd prepare openfoam-pipe openfoam-pipe --fully-developed --cross-section-cells 4 --axial-cells 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-pipe openfoam-turbulent-pipe --cross-section-cells 4 --axial-cells 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-precursor openfoam-turbulent-precursor --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-precursor openfoam-k-epsilon-precursor --turbulence-model k-epsilon --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-wall-study openfoam-turbulent-wall-study --cross-section-cells 4 8 16 --maximum-iterations 20 20 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-wall-function-study openfoam-turbulent-wall-functions --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-model-study openfoam-turbulent-models --velocity 0.5 --target-y-plus 40 --cross-section-cells 4 --maximum-iterations 20 --json
