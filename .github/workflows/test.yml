name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: agentcfd doctor

  offline-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --no-index dist/*.whl
      - run: wheel-test/bin/python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None"
      - run: wheel-test/bin/agentcfd doctor --json
      - run: wheel-test/bin/agentcfd contracts --json
      - run: wheel-test/bin/python -c "import agentcfd; from agentcfd import contracts; assert callable(agentcfd.open_project); assert contracts.path('project-snapshot.schema.json').is_file(); assert contracts.path('project-verification.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('parameter-set.schema.json').is_file(); assert contracts.path('inlet-direction-assessment.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-precursor-map.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-wall-study.schema.json').is_file(); assert contracts.path('turbulent-wall-study.schema.json').is_file(); assert contracts.path('turbulent-precursor-grid-study.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-wall-function-study.schema.json').is_file(); assert contracts.path('turbulent-wall-function-study.schema.json').is_file()"
      - run: wheel-test/bin/python -c "from agentcfd import contracts; assert contracts.path('openfoam-turbulent-model-study.schema.json').is_file(); assert contracts.path('openfoam-turbulent-model-sweep.schema.json').is_file(); assert contracts.path('turbulent-model-study.schema.json').is_file(); assert contracts.path('turbulent-model-sweep.schema.json').is_file()"
      - run: wheel-test/bin/agentcfd calculate compressibility --velocity 100 --speed-of-sound 400 --json
      - run: wheel-test/bin/agentcfd calculate wall-resolution --density 998.2 --viscosity 0.001002 --velocity 0.5 --diameter 0.1 --target-y-plus 40 --json
      - run: wheel-test/bin/agentcfd calculate thermal-flow --density 998.2 --viscosity 0.001002 --specific-heat 4180 --thermal-conductivity 0.6 --velocity 0.01 --diameter 0.1 --flow-area 0.007853981633974483 --inlet-temperature 300 --heat-rate 62.83185307179586 --json
      - run: wheel-test/bin/agentcfd demo pipe --output pipe-result.json
      - run: wheel-test/bin/agentcfd init operating-point-project --template industrial-pipe
      - run: wheel-test/bin/agentcfd project operating-point-project --no-result --json
      - run: wheel-test/bin/agentcfd run operating-point-project --json
      - run: wheel-test/bin/agentcfd verify project operating-point-project --json
      - run: wheel-test/bin/agentcfd params operating-point-project --param mean_velocity=0.015 --output operating-point.json --json
      - run: wheel-test/bin/agentcfd plan operating-point-project --param-file operating-point.json --json
      - run: wheel-test/bin/agentcfd init heated-pipe-project --template heated-pipe
      - run: wheel-test/bin/agentcfd plan heated-pipe-project --summary-only --json
      - run: wheel-test/bin/python -c "from agentcfd import projects; from agentcfd.providers import OpenFOAMProvider; p=projects.Project('heated-pipe-project'); c=OpenFOAMProvider().prepare(p.load_step(), 'heated-pipe-case'); assert (c.directory/'0/T').is_file(); assert c.capability == 'openfoam.steady-laminar-heated-circular-pipe'"
      - run: wheel-test/bin/agentcfd init heated-request-project --request examples/heated_pipe_project/project-request.json --json
      - run: wheel-test/bin/python -c "from agentcfd import projects; p=projects.Project('heated-request-project'); assert p.load_step().model.boundary_conditions['wall'].thermal.heat_flux_into_fluid == 100.0"
      - run: wheel-test/bin/agentcfd init imported-pressure --template imported-internal-flow --geometry examples/imported_duct_mesh/geometry/fluid.stl --unit m --roles examples/imported_duct_mesh/geometry/boundary-roles.json --interior-point-m 0.5 0.25 0.1 --inlet-total-gauge-pressure-pa 0.001 --base-size-m 0.05 --maximum-cells 200000
      - run: wheel-test/bin/python -c "from agentcfd import projects; p=projects.Project('imported-pressure'); assert p.load_step().model.boundary_conditions['inlet'].total_gauge_pressure == 0.001; assert len(p.parameter_contract()) == 12"
      - run: wheel-test/bin/agentcfd init imported-velocity --template imported-internal-flow --geometry examples/imported_duct_mesh/geometry/fluid.stl --unit m --roles examples/imported_duct_mesh/geometry/boundary-roles.json --interior-point-m 0.5 0.25 0.1 --inlet-velocity-m-s 0.5 0 0 --base-size-m 0.05 --maximum-cells 200000
      - run: wheel-test/bin/python -c "from agentcfd import projects; assert projects.Project('imported-velocity').load_step().model.metadata['inlet_velocity_direction']['status'] == 'passed'"
      - run: wheel-test/bin/agentcfd prepare openfoam-pipe openfoam-pipe --fully-developed --cross-section-cells 4 --axial-cells 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-pipe openfoam-turbulent-pipe --cross-section-cells 4 --axial-cells 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-precursor openfoam-turbulent-precursor --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-precursor openfoam-k-epsilon-precursor --turbulence-model k-epsilon --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-wall-study openfoam-turbulent-wall-study --cross-section-cells 4 8 16 --maximum-iterations 20 20 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-wall-function-study openfoam-turbulent-wall-functions --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-model-study openfoam-turbulent-models --velocity 0.5 --target-y-plus 40 --cross-section-cells 4 --maximum-iterations 20 --json
      - run: wheel-test/bin/agentcfd prepare openfoam-turbulent-model-sweep openfoam-turbulent-model-sweep --velocities 0.5 1 2 --target-y-plus 40 --cross-section-cells 4 --maximum-iterations 20 --json
