name: Fast test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.md"
      - "LICENSE"
      - "NOTICE"
permissions:
  contents: read

concurrency:
  group: fast-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --no-index dist/*.whl
      - run: wheel-test/bin/python ci/installed_wheel_smoke.py
